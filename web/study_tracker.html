<script>
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('sql_tracker_v1') || '{}');
    if (s.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    if (s.lastActive) document.documentElement.classList.add('has-active');
  } catch(e){}
})();
</script>
<style>html.has-active .welcome{display:none}</style>
<link rel="stylesheet" href="../web/css/style.css?v=2">
</head>
<body>

<header>
  <button class="icon-btn menu-btn" id="menu-btn" title="Menu" aria-label="Ouvrir le menu">
    <span class="menu-ico"></span>
  </button>
  <a class="logo" href="#" aria-label="Accueil">
    <span class="logo-icon"><img src="../web/image/logo.svg" alt="" /></span>
    <span><b class="accent">SQL</b> Tracker</span>
  </a>
  <div class="spacer"></div>
  <div class="stat-group" aria-label="Statistiques">
    <div class="stat" title="Lecons terminees"><span>📚</span><b id="stat-lessons">0</b><span class="stat-lbl">lecons</span></div>
    <div class="stat" title="Exercices completes"><span>✍️</span><b id="stat-exercises">0</b><span class="stat-lbl">exos</span></div>
    <div class="stat" title="Jours actifs"><span>🔥</span><b id="stat-streak">0</b><span class="stat-lbl">j</span></div>
  </div>
  <button class="icon-btn theme-btn" id="theme-btn" title="Basculer thème" aria-label="Basculer thème">
    <svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    <svg class="theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</header>

<div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>

<aside class="sidebar" id="sidebar" aria-label="Navigation des lecons">
  <div class="search-wrap">
    <input id="search" type="text" placeholder='Rechercher (raccourci : "/")' aria-label="Rechercher" />
  </div>

  <div class="progress-card">
    <div class="progress-head">
      <span class="progress-label">Progression</span>
      <span class="progress-pct"><span id="pct">0</span><small>%</small></span>
    </div>
    <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <span class="progress-fill" id="bar-fill"></span>
    </div>
    <div class="progress-meta">
      <span><b id="pct-lessons">0</b>/<b id="pct-lessons-total">0</b> lecons</span>
      <span class="dot">·</span>
      <span><b id="pct-exos">0</b>/<b id="pct-exos-total">0</b> exos</span>
    </div>
  </div>

  <div class="achieve-section">
    <div class="section-title">🏆 Succès</div>
    <div class="achieve-row" id="achieve-row"></div>
  </div>

  <div class="section-title collapsible" data-section="days">
    📘 Plan 7 jours <span class="collapse-arrow">▾</span>
  </div>
  <div id="nav-days" class="nav-section"></div>

  <div class="section-title collapsible" data-section="basic">
    🟢 SQL Basic <span class="collapse-arrow">▾</span>
  </div>
  <div id="nav-basic" class="nav-section"></div>

  <div class="section-title collapsible" data-section="intermediate">
    🟡 SQL Intermediate <span class="collapse-arrow">▾</span>
  </div>
  <div id="nav-intermediate" class="nav-section"></div>

  <div class="section-title collapsible" data-section="advanced">
    🔴 SQL Advanced <span class="collapse-arrow">▾</span>
  </div>
  <div id="nav-advanced" class="nav-section"></div>

  <button class="reset-btn" id="reset-btn">🗑️ Reinitialiser la progression</button>
</aside>

<div class="layout">
  <main id="main">
    <div class="welcome">
      <h1>Plan d'attaque <span class="accent">SQL</span></h1>
      <p>7 jours pour maitriser SQL : SELECT, JOIN, GROUP BY, transactions, indexes.</p>

      <div class="quick-grid">
        <button class="quick-card" data-jump="day-1"><div class="big">📘 Jour 1</div><div class="sub">SELECT & WHERE</div></button>
        <button class="quick-card" data-jump="day-2"><div class="big">📘 Jour 2</div><div class="sub">ORDER, LIMIT, DISTINCT</div></button>
        <button class="quick-card" data-jump="day-3"><div class="big">📘 Jour 3</div><div class="sub">JOINs</div></button>
        <button class="quick-card" data-jump="day-4"><div class="big">📘 Jour 4</div><div class="sub">GROUP BY & aggregates</div></button>
        <button class="quick-card" data-jump="day-5"><div class="big">📘 Jour 5</div><div class="sub">Subqueries & CTE</div></button>
        <button class="quick-card" data-jump="day-6"><div class="big">📘 Jour 6</div><div class="sub">INSERT/UPDATE/DELETE</div></button>
        <button class="quick-card" data-jump="day-7"><div class="big">🏁 Jour 7</div><div class="sub">Indexes & projet</div></button>
        <button class="quick-card" data-jump="w3-intro"><div class="big">🟢 Basic</div><div class="sub">W3 Basic - 6 lecons</div></button>
        <button class="quick-card" data-jump="w3-joins"><div class="big">🟡 Intermediate</div><div class="sub">W3 Intermediate - 6 lecons</div></button>
        <button class="quick-card" data-jump="w3-indexes"><div class="big">🔴 Advanced</div><div class="sub">W3 Advanced - 4 lecons</div></button>
      </div>
    </div>
  </main>
</div>

<div class="shortcuts-hint">
  <kbd>/</kbd> chercher <span>·</span>
  <kbd>←</kbd><kbd>→</kbd> naviguer <span>·</span>
  <kbd>T</kbd> cours/exos <span>·</span>
  <kbd>Esc</kbd> fermer
</div>

<script src="../web/js/data.js?v=2"></script>
<script src="../web/js/app.js?v=2"></script>
