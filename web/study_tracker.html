<script>
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('sql_tracker_v1') || '{}');
    if (s.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    if (s.lastActive) document.documentElement.classList.add('has-active');
  } catch(e){}
})();
</script>
<style>html.has-active .welcome{display:none}</style>
<link rel="stylesheet" href="../web/css/style.css?v=20260601a">
</head>
<body>

<div class="scroll-progress" id="scroll-progress"></div>

<header>
  <button class="icon-btn menu-btn" id="menu-btn" title="Menu" aria-label="Open menu">
    <span class="menu-ico"></span>
  </button>
  <a class="logo" href="#" aria-label="Home">
    <span class="logo-icon"><img src="../web/image/logo.svg" alt="" /></span>
    <span><b class="accent">SQL</b> Tracker</span>
  </a>
  <div class="exam-countdown" id="exam-countdown" title=""><span class="exam-ico">🗓️</span><b id="exam-days">0</b><span class="exam-lbl" id="exam-lbl">d</span></div>
  <div class="spacer"></div>
  <div class="stat-group" aria-label="Statistics">
    <div class="stat" id="stat-lessons-wrap"><span>📚</span><b id="stat-lessons">0</b><span class="stat-lbl" data-i18n="lessonsShort">lessons</span></div>
    <div class="stat" id="stat-exercises-wrap"><span>✍️</span><b id="stat-exercises">0</b><span class="stat-lbl" data-i18n="exosShort">exos</span></div>
    <div class="stat" id="stat-streak-wrap"><span>🔥</span><b id="stat-streak">0</b><span class="stat-lbl" data-i18n="dShort">d</span></div>
  </div>
  <button class="icon-btn pomo-trigger" id="pomo-btn" title="Pomodoro" aria-label="Pomodoro timer">
    <span class="pomo-ico">🍅</span><span class="pomo-time" id="pomo-time"></span>
  </button>
  <button class="lang-btn" id="lang-btn" title="Switch language" aria-label="Switch language">
    <svg class="lang-globe" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <span id="lang-label">FR</span>
  </button>
  <button class="icon-btn theme-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">
    <svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    <svg class="theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</header>

<div class="drawer-backdrop" id="drawer-backdrop" aria-hidden="true"></div>

<aside class="sidebar" id="sidebar" aria-label="Lesson navigation">
  <div class="search-wrap">
    <input id="search" type="text" data-i18n-placeholder="search" placeholder='Rechercher (raccourci : "/")' aria-label="Search" />
  </div>

  <div class="progress-card">
    <div class="progress-head">
      <span class="progress-label" data-i18n="progress">Progression</span>
      <span class="progress-pct"><span id="pct">0</span><small>%</small></span>
    </div>
    <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <span class="progress-fill" id="bar-fill"></span>
    </div>
    <div class="progress-meta">
      <span><b id="pct-lessons">0</b>/<b id="pct-lessons-total">41</b> <span data-i18n="lessons">leçons</span></span>
      <span class="dot">·</span>
      <span><b id="pct-exos">0</b>/<b id="pct-exos-total">140</b> <span data-i18n="exos">exos</span></span>
    </div>
    <div class="day-indicator" id="day-indicator" hidden></div>
    <div class="daily-goal" id="daily-goal"></div>
  </div>

  <div class="achieve-section">
    <div class="section-title achieve-title">
      <span data-i18n="achievements">🏆 Succès</span>
      <span class="achieve-count" id="achieve-count">0/10</span>
    </div>
    <div class="achieve-row" id="achieve-row"></div>
  </div>

  <div class="nav-mode" role="tablist" aria-label="View">
    <button class="nav-mode-btn active" data-mode="plan" role="tab" aria-selected="true"><span data-i18n="modePlan">📅 Plan</span></button>
    <button class="nav-mode-btn" data-mode="ref" role="tab" aria-selected="false"><span data-i18n="modeRef">📖 Référence</span></button>
  </div>

  <div class="nav-track" data-track="plan">
    <div class="section-title collapsible" data-section="days">
      <span data-i18n="plan7">📘 Plan 7 jours</span> <span class="collapse-arrow">▾</span>
    </div>
    <div id="nav-days" class="nav-section"></div>
  </div>

  <div class="nav-track" data-track="ref" hidden>
    <div class="section-title collapsible" data-section="basic">
      <span data-i18n="basic">🟢 PHP Basic</span> <span class="collapse-arrow">▾</span>
    </div>
    <div id="nav-basic" class="nav-section"></div>

    <div class="section-title collapsible" data-section="intermediate">
      <span data-i18n="intermediate">🟡 PHP Intermediate</span> <span class="collapse-arrow">▾</span>
    </div>
    <div id="nav-intermediate" class="nav-section"></div>

    <div class="section-title collapsible" data-section="advanced">
      <span data-i18n="advanced">🔴 PHP Advanced</span> <span class="collapse-arrow">▾</span>
    </div>
    <div id="nav-advanced" class="nav-section"></div>
  </div>

  <div class="sidebar-actions">
    <button class="sidebar-action-btn" id="export-btn" data-i18n="exportBtn">⬇️ Exporter</button>
    <button class="sidebar-action-btn" id="import-btn" data-i18n="importBtn">⬆️ Importer</button>
  </div>
  <button class="reset-btn" id="reset-btn" data-i18n="resetBtn">🗑️ Réinitialiser la progression</button>
</aside>

<div class="layout">
  <main id="main"></main>
</div>

<div class="shortcuts-hint">
  <kbd>/</kbd> <span data-i18n="hintSearch">chercher</span> <span>·</span>
  <kbd>←</kbd><kbd>→</kbd> <span data-i18n="hintNav">naviguer</span> <span>·</span>
  <kbd>T</kbd> <span data-i18n="hintCourseEx">cours/exos</span> <span>·</span>
  <kbd>D</kbd> <span data-i18n="hintDone">fait</span> <span>·</span>
  <kbd>R</kbd> <span data-i18n="hintRandom">aléatoire</span> <span>·</span>
  <kbd>Esc</kbd> <span data-i18n="hintClose">fermer</span>
</div>

<!-- Modal (used by reset, export, import) -->
<div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- Exercise modal: centered overlay used when a card is clicked -->
<div class="ex-modal" id="ex-modal" role="dialog" aria-modal="true" aria-labelledby="ex-modal-title" hidden>
  <div class="ex-modal-backdrop" id="ex-modal-backdrop"></div>
  <div class="ex-modal-dialog" id="ex-modal-dialog">
    <button class="ex-modal-close" id="ex-modal-close" aria-label="Close">×</button>
    <div class="ex-modal-head">
      <span class="ex-modal-num" id="ex-modal-num"></span>
      <h2 class="ex-modal-title" id="ex-modal-title"></h2>
      <span class="ex-modal-diff" id="ex-modal-diff"></span>
    </div>
    <div class="ex-modal-body" id="ex-modal-body"></div>
    <div class="ex-modal-actions" id="ex-modal-actions"></div>
    <div class="ex-modal-sol" id="ex-modal-sol" hidden></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" aria-live="polite"></div>

<!-- Pomodoro panel -->
<div class="pomo-panel" id="pomo-panel" role="dialog" aria-label="Pomodoro" aria-hidden="true">
  <div class="pomo-phase" id="pomo-phase">Focus</div>
  <div class="pomo-display" id="pomo-display">25:00</div>
  <div class="pomo-bar"><span class="pomo-bar-fill" id="pomo-bar-fill"></span></div>
  <div class="pomo-controls">
    <button class="pomo-btn-main" id="pomo-toggle">Start</button>
    <button class="pomo-btn-mini" id="pomo-skip" data-i18n-title="pomoSkip" title="Skip">⏭</button>
    <button class="pomo-btn-mini" id="pomo-reset" data-i18n-title="pomoResetT" title="Reset">↺</button>
  </div>
  <div class="pomo-meta"><b id="pomo-count">0</b> <span data-i18n="pomoDone">pomodoros aujourd'hui</span></div>
  <div class="pomo-settings">
    <label><span data-i18n="pomoFocusMin">Focus (min)</span><input type="number" id="pomo-focus-min" min="1" max="90" value="25"></label>
    <label><span data-i18n="pomoBreakMin">Pause (min)</span><input type="number" id="pomo-short-min" min="1" max="60" value="5"></label>
    <button class="pomo-sound" id="pomo-sound" data-i18n-title="pomoSound" title="Sound">🔔</button>
  </div>
</div>

<!-- Jump to top -->
<button class="jump-top" id="jump-top" title="Top" aria-label="Scroll to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<script src="../web/js/data.js?v=20260601a"></script>
<script src="../web/js/app.js?v=20260601a"></script>
</body>
</html>
